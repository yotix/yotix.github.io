<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Yogesh Bhardwaj — Cloud Lead. Architecting scalable infrastructure, leading cloud transformation, and building resilient distributed systems."
        />
        <meta property="og:title" content="Yogesh Bhardwaj — Cloud Lead" />
        <meta
            property="og:description"
            content="Cloud infrastructure leadership. Scalable systems. Distributed architecture."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <title>Yogesh Bhardwaj — Cloud Lead</title>
        <link rel="icon" type="image/png" href="logo192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
                color: #1a1a2e;
                background: #faf9f7;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                overflow-x: hidden;
            }
            code,
            .font-mono {
                font-family: "JetBrains Mono", monospace;
            }
            :focus-visible {
                outline: 2px solid #2563eb;
                outline-offset: 2px;
                border-radius: 4px;
            }

            /* ── Entry Animations ── */
            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(24px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateX(-16px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
            @keyframes scaleIn {
                from {
                    opacity: 0;
                    transform: scale(0.96);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            @keyframes grain {
                0%,
                100% {
                    transform: translate(0, 0);
                }
                10% {
                    transform: translate(-5%, -10%);
                }
                20% {
                    transform: translate(-15%, 5%);
                }
                30% {
                    transform: translate(7%, -25%);
                }
                40% {
                    transform: translate(-5%, 25%);
                }
                50% {
                    transform: translate(-15%, 10%);
                }
                60% {
                    transform: translate(15%, 0%);
                }
                70% {
                    transform: translate(0%, 15%);
                }
                80% {
                    transform: translate(3%, 35%);
                }
                90% {
                    transform: translate(-10%, 10%);
                }
            }

            .anim-fade-up {
                animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .anim-fade-up-d1 {
                animation-delay: 0.1s;
            }
            .anim-fade-up-d2 {
                animation-delay: 0.2s;
            }
            .anim-fade-up-d3 {
                animation-delay: 0.3s;
            }
            .anim-fade-up-d4 {
                animation-delay: 0.4s;
            }
            .anim-fade-in {
                animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .anim-slide-in {
                animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .anim-scale-in {
                animation: scaleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ── Grain Texture Overlay ── */
            .grain::after {
                content: "";
                position: absolute;
                inset: -50%;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
                background-repeat: repeat;
                background-size: 128px 128px;
                animation: grain 8s steps(10) infinite;
                pointer-events: none;
                z-index: 0;
                opacity: 0.4;
            }

            /* ── Hover Card Elevation ── */
            .card-hover {
                transition:
                    transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-2px);
                box-shadow:
                    0 8px 24px rgba(0, 0, 0, 0.06),
                    0 2px 6px rgba(0, 0, 0, 0.04);
            }

            /* ── Text Gradient ── */
            .text-gradient {
                background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            /* ── Glow Accent ── */
            .glow-accent {
                position: relative;
            }
            .glow-accent::before {
                content: "";
                position: absolute;
                top: -20px;
                left: -20px;
                right: -20px;
                bottom: -20px;
                background: radial-gradient(
                    ellipse at center,
                    rgba(37, 99, 235, 0.08) 0%,
                    transparent 70%
                );
                pointer-events: none;
                z-index: 0;
            }

            /* ── Dot Grid Background ── */
            .dot-grid {
                background-image: radial-gradient(
                    circle,
                    rgba(37, 99, 235, 0.06) 1px,
                    transparent 1px
                );
                background-size: 24px 24px;
            }

            /* ── Section Divider ── */
            .section-divider {
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(229, 228, 224, 0.8) 50%,
                    transparent 100%
                );
            }

            /* ── Button Shine Effect ── */
            .btn-shine {
                position: relative;
                overflow: hidden;
            }
            .btn-shine::after {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.15),
                    transparent
                );
                transition: left 0.5s ease;
            }
            .btn-shine:hover::after {
                left: 100%;
            }

            /* ── Dark Section ── */
            .dark-section {
                background: linear-gradient(180deg, #0f1117 0%, #161822 100%);
                color: #e4e4e7;
            }
            .dark-section .section-text {
                color: #a1a1aa;
            }
            .dark-section .section-heading {
                color: #fafafa;
            }

            /* ── Nav Active Indicator ── */
            .nav-link {
                position: relative;
                transition: color 0.2s ease;
            }
            .nav-link::after {
                content: "";
                position: absolute;
                bottom: -4px;
                left: 0;
                width: 0;
                height: 2px;
                background: #2563eb;
                border-radius: 1px;
                transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .nav-link-active::after {
                width: 100%;
            }

            /* ── Tag Pill ── */
            .tag-pill {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 3px 10px;
                border-radius: 100px;
                font-size: 12px;
                font-weight: 500;
                letter-spacing: 0.01em;
                border: 1px solid rgba(37, 99, 235, 0.15);
                background: rgba(37, 99, 235, 0.05);
                color: #2563eb;
                transition: all 0.2s ease;
            }
            .tag-pill:hover {
                background: rgba(37, 99, 235, 0.1);
                border-color: rgba(37, 99, 235, 0.3);
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
                html {
                    scroll-behavior: auto;
                }
            }

            /* ═══════════════════════════════════════════════
           ENHANCED ANIMATIONS
        ═══════════════════════════════════════════════ */

            /* ── Floating Geometric Shapes ── */
            @keyframes float {
                0%,
                100% {
                    transform: translateY(0) rotate(0deg);
                }
                25% {
                    transform: translateY(-20px) rotate(5deg);
                }
                50% {
                    transform: translateY(-10px) rotate(0deg);
                }
                75% {
                    transform: translateY(-30px) rotate(-5deg);
                }
            }
            @keyframes floatSlow {
                0%,
                100% {
                    transform: translateY(0) rotate(0deg) scale(1);
                }
                50% {
                    transform: translateY(-40px) rotate(180deg) scale(1.1);
                }
            }
            @keyframes floatPulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 0.5;
                }
                50% {
                    transform: scale(1.2);
                    opacity: 0.8;
                }
            }
            @keyframes morphShape {
                0%,
                100% {
                    border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
                }
                25% {
                    border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
                }
                50% {
                    border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%;
                }
                75% {
                    border-radius: 60% 30% 60% 40% / 70% 40% 50% 60%;
                }
            }

            .shape-float {
                animation: float 8s ease-in-out infinite;
            }
            .shape-float-slow {
                animation: floatSlow 15s ease-in-out infinite;
            }
            .shape-float-pulse {
                animation: floatPulse 6s ease-in-out infinite;
            }
            .shape-morph {
                animation: morphShape 20s ease-in-out infinite;
            }

            /* ── Gradient Mesh Background ── */
            @keyframes gradientShift {
                0%,
                100% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
            }
            .gradient-mesh {
                background: linear-gradient(
                    135deg,
                    rgba(37, 99, 235, 0.08) 0%,
                    rgba(124, 58, 237, 0.06) 25%,
                    rgba(59, 130, 246, 0.04) 50%,
                    rgba(139, 92, 246, 0.06) 75%,
                    rgba(37, 99, 235, 0.08) 100%
                );
                background-size: 400% 400%;
                animation: gradientShift 15s ease infinite;
            }

            /* ── Scroll Reveal Animations ── */
            .reveal-up {
                opacity: 0;
                transform: translateY(40px);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-up.visible {
                opacity: 1;
                transform: translateY(0);
            }
            .reveal-left {
                opacity: 0;
                transform: translateX(-40px);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-left.visible {
                opacity: 1;
                transform: translateX(0);
            }
            .reveal-right {
                opacity: 0;
                transform: translateX(40px);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-right.visible {
                opacity: 1;
                transform: translateX(0);
            }
            .reveal-scale {
                opacity: 0;
                transform: scale(0.9);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-scale.visible {
                opacity: 1;
                transform: scale(1);
            }

            /* ── Stagger Children Animation ── */
            .stagger-children > * {
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .stagger-children.visible > *:nth-child(1) {
                transition-delay: 0s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(2) {
                transition-delay: 0.1s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(3) {
                transition-delay: 0.2s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(4) {
                transition-delay: 0.3s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(5) {
                transition-delay: 0.4s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(6) {
                transition-delay: 0.5s;
                opacity: 1;
                transform: translateY(0);
            }

            /* ── Animated Counter ── */
            @keyframes countUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .counter-animated {
                animation: countUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ── Animated Divider Line ── */
            @keyframes expandWidth {
                from {
                    width: 0;
                }
                to {
                    width: 100%;
                }
            }
            .divider-animated {
                height: 2px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(37, 99, 235, 0.3),
                    transparent
                );
                animation: expandWidth 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ── Hover Image Overlay ── */
            .hover-overlay {
                position: relative;
                overflow: hidden;
            }
            .hover-overlay::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    135deg,
                    rgba(37, 99, 235, 0.1),
                    rgba(124, 58, 237, 0.1)
                );
                opacity: 0;
                transition: opacity 0.4s ease;
                z-index: 1;
            }
            .hover-overlay:hover::before {
                opacity: 1;
            }
            .hover-overlay img {
                transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .hover-overlay:hover img {
                transform: scale(1.05);
            }

            /* ── Marquee Animation ── */
            @keyframes marquee {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-50%);
                }
            }
            .marquee {
                animation: marquee 30s linear infinite;
            }
            .marquee:hover {
                animation-play-state: paused;
            }

            /* ── Shimmer Effect ── */
            @keyframes shimmer {
                0% {
                    background-position: -200% 0;
                }
                100% {
                    background-position: 200% 0;
                }
            }
            .shimmer {
                background: linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.1) 50%,
                    transparent 100%
                );
                background-size: 200% 100%;
                animation: shimmer 3s infinite;
            }

            /* ── Page Transition ── */
            @keyframes pageEnter {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .page-enter {
                animation: pageEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            @media (min-width: 1100px) {
                .hero-photo {
                    display: block;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/babel">
            const { useState, useEffect, createContext, useContext, useRef } =
                React;
            const { createRoot } = ReactDOM;

            /* ── Lightweight SPA Router ── */
            const RouterCtx = createContext();
            function Router({ children }) {
                const [path, setPath] = useState(
                    window.location.hash.slice(1) || "/",
                );
                useEffect(() => {
                    const onHash = () =>
                        setPath(window.location.hash.slice(1) || "/");
                    window.addEventListener("hashchange", onHash);
                    return () =>
                        window.removeEventListener("hashchange", onHash);
                }, []);
                const navigate = (to) => {
                    window.location.hash = to;
                };
                return (
                    <RouterCtx.Provider value={{ path, navigate }}>
                        {children}
                    </RouterCtx.Provider>
                );
            }
            function Route({ path, element }) {
                const { path: current } = useContext(RouterCtx);
                if (current === path) return element;
                return null;
            }
            function Link({ to, children, style, ...props }) {
                const { navigate } = useContext(RouterCtx);
                const href = to.startsWith("#") ? to : "#" + to;
                return (
                    <a
                        href={href}
                        onClick={(e) => {
                            e.preventDefault();
                            navigate(to);
                        }}
                        style={{
                            textDecoration: "none",
                            cursor: "pointer",
                            ...style,
                        }}
                        {...props}
                    >
                        {children}
                    </a>
                );
            }
            function useLocation() {
                const { path } = useContext(RouterCtx);
                return { pathname: path };
            }

            /* ── Scroll Animation Hook ── */
            const useScrollAnimations = () => {
                useEffect(() => {
                    const observer = new IntersectionObserver(
                        (entries) => {
                            entries.forEach((entry) => {
                                if (entry.isIntersecting) {
                                    entry.target.classList.add("visible");
                                }
                            });
                        },
                        { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
                    );

                    const elements = document.querySelectorAll(
                        ".reveal-up, .reveal-left, .reveal-right, .reveal-scale, .stagger-children",
                    );
                    elements.forEach((el) => observer.observe(el));

                    return () => observer.disconnect();
                }, []);
            };

            /* ── Animated Counter Hook ── */
            const useAnimatedCounter = (target, duration = 2000) => {
                const [count, setCount] = useState(0);
                const ref = useRef(null);
                const hasAnimated = useRef(false);

                useEffect(() => {
                    const observer = new IntersectionObserver(
                        (entries) => {
                            if (
                                entries[0].isIntersecting &&
                                !hasAnimated.current
                            ) {
                                hasAnimated.current = true;
                                const start = 0;
                                const startTime = performance.now();

                                const animate = (currentTime) => {
                                    const elapsed = currentTime - startTime;
                                    const progress = Math.min(
                                        elapsed / duration,
                                        1,
                                    );
                                    const eased = 1 - Math.pow(1 - progress, 3);
                                    setCount(
                                        Math.floor(
                                            start + (target - start) * eased,
                                        ),
                                    );

                                    if (progress < 1) {
                                        requestAnimationFrame(animate);
                                    }
                                };

                                requestAnimationFrame(animate);
                            }
                        },
                        { threshold: 0.5 },
                    );

                    if (ref.current) {
                        observer.observe(ref.current);
                    }

                    return () => observer.disconnect();
                }, [target, duration]);

                return { count, ref };
            };

            /* ── Theme Tokens ── */
            const T = {
                bg: "#faf9f7",
                surface: "#ffffff",
                ink: "#111827",
                muted: "#6b7280",
                mutedLight: "#9ca3af",
                accent: "#2563eb",
                accentHover: "#1d4ed8",
                accentLight: "#3b82f6",
                border: "#e5e7eb",
                borderLight: "#f3f4f6",
                success: "#16a34a",
                warning: "#d97706",
                dark: "#0f1117",
                darkSurface: "#161822",
                darkInk: "#fafafa",
                darkMuted: "#a1a1aa",
                darkBorder: "#27272a",
                purple: "#7c3aed",
                purpleLight: "#8b5cf6",
            };

            /* ── Shared Styles ── */
            const S = {
                container: {
                    maxWidth: 1120,
                    margin: "0 auto",
                    padding: "0 24px",
                },
                section: { padding: "96px 0" },
                sectionDark: {
                    padding: "96px 0",
                    background: `linear-gradient(180deg, ${T.dark} 0%, ${T.darkSurface} 100%)`,
                    color: T.darkInk,
                },
                heading: {
                    letterSpacing: "-0.03em",
                    lineHeight: 1.1,
                    fontWeight: 700,
                    color: T.ink,
                },
                headingLight: {
                    letterSpacing: "-0.03em",
                    lineHeight: 1.1,
                    fontWeight: 700,
                    color: T.darkInk,
                },
                body: { fontSize: 16, lineHeight: 1.7, color: T.muted },
                bodyLight: {
                    fontSize: 16,
                    lineHeight: 1.7,
                    color: T.darkMuted,
                },
                label: {
                    fontSize: 13,
                    fontWeight: 600,
                    letterSpacing: "0.06em",
                    textTransform: "uppercase",
                    color: T.accent,
                },
                labelLight: {
                    fontSize: 13,
                    fontWeight: 600,
                    letterSpacing: "0.06em",
                    textTransform: "uppercase",
                    color: T.accentLight,
                },
                card: {
                    background: T.surface,
                    borderRadius: 16,
                    border: `1px solid ${T.border}`,
                    padding: 32,
                    transition: "all 0.3s cubic-bezier(0.22, 1, 0.36, 1)",
                },
                cardDark: {
                    background: `${T.darkSurface}cc`,
                    borderRadius: 16,
                    border: `1px solid ${T.darkBorder}`,
                    padding: 32,
                    transition: "all 0.3s cubic-bezier(0.22, 1, 0.36, 1)",
                },
            };

            /* ── Skip Link ── */
            const SkipLink = () => (
                <a
                    href='#main-content'
                    style={{
                        position: "absolute",
                        top: "-100%",
                        left: 16,
                        background: T.accent,
                        color: "#fff",
                        padding: "8px 16px",
                        borderRadius: 8,
                        zIndex: 999,
                        fontWeight: 600,
                        fontSize: 14,
                    }}
                    onFocus={(e) => (e.target.style.top = "16px")}
                    onBlur={(e) => (e.target.style.top = "-100%")}
                >
                    Skip to content
                </a>
            );

            /* ── Navbar ── */
            const Navbar = () => {
                const [open, setOpen] = useState(false);
                const loc = useLocation();
                const links = [
                    { to: "/", label: "Home" },
                    { to: "/work", label: "Work" },
                    { to: "/about", label: "About" },

                        const ref = useRef(null);

                            const observer = new IntersectionObserver(
                                (entries) => {
                                    if (
                                        entries[0].isIntersecting &&
                                        !hasAnimated.current
                                    ) {
                                        hasAnimated.current = true;
                                        const duration = 1500;
                                        const startTime = performance.now();
                                        const animate = (currentTime) => {
                                            const progress = Math.min(
                                                (currentTime - startTime) /
                                                    duration,
                                                1,
                                            );
                                            const eased =
                                                1 - Math.pow(1 - progress, 3);
                                            setAnimatedValue(
                                                Math.floor(value * eased),
                                            );
                                            if (progress < 1)
                                                requestAnimationFrame(animate);
                                        };
                                        requestAnimationFrame(animate);
                                    }
                                },

                            );
                            if (ref.current) observer.observe(ref.current);
                            return () => observer.disconnect();
