<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Yogesh Bhardwaj — Cloud Lead in Berlin. Go-based telemetry, IAM infrastructure, real-time systems for renewable energy."
        />
        <meta property="og:title" content="Yogesh Bhardwaj — Cloud Lead" />
        <meta
            property="og:description"
            content="Cloud engineering at Inno2grid. 100x throughput gain from Python to Go migration."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <title>Yogesh Bhardwaj — Cloud Lead</title>
        <link rel="icon" type="image/png" href="logo192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            /* ── Tokens ── */
            :root {
                --bg: oklch(0.97 0.01 82);
                --ink: oklch(0.15 0.015 80);
                --muted: oklch(0.52 0.018 80);
                --hairline: oklch(0.88 0.015 80);
                --accent: oklch(0.68 0.19 55);
                --accent-t: oklch(0.48 0.18 55);
                --accent-bg: oklch(0.95 0.05 78);
                --green: oklch(0.62 0.17 148);
            }

            /* ── Reset ── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family: "Inter", system-ui, sans-serif;
                color: var(--ink);
                background: var(--bg);
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
                line-height: 1;
            }
            a {
                color: inherit;
            }
            button {
                font-family: inherit;
                cursor: pointer;
            }
            img {
                display: block;
                max-width: 100%;
            }

            /* ── Type utilities ── */
            .syne {
                font-family: "Syne", sans-serif;
            }
            .mono {
                font-family: "JetBrains Mono", monospace;
            }

            /* ── Layout ── */
            .wrap {
                max-width: 1100px;
                margin: 0 auto;
                padding: 0 28px;
            }

            /* ── Skip link ── */
            .skip-link {
                position: absolute;
                top: -100%;
                left: 16px;
                background: var(--ink);
                color: var(--bg);
                padding: 8px 16px;
                border-radius: 6px;
                z-index: 999;
                font-weight: 600;
                font-size: 14px;
                text-decoration: none;
            }
            .skip-link:focus {
                top: 16px;
            }
            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
                border-radius: 3px;
            }

            /* ── Signal line ── */
            .signal-line {
                width: 100%;
                height: 1px;
                border: none;
                background: var(--hairline);
                position: relative;
            }
            .signal-line::after {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                width: 64px;
                height: 1px;
                background: var(--accent);
            }

            /* ── Scroll reveal ── */
            .reveal {
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal.visible {
                opacity: 1;
                transform: none;
            }
            .reveal-d1 {
                transition-delay: 0.08s;
            }
            .reveal-d2 {
                transition-delay: 0.16s;
            }
            .reveal-d3 {
                transition-delay: 0.24s;
            }

            /* ── Nav ── */
            #nav {
                position: sticky;
                top: 0;
                z-index: 50;
                height: 60px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid transparent;
                background: transparent;
                transition:
                    border-color 0.25s ease,
                    background 0.25s ease;
            }
            #nav.scrolled {
                border-bottom-color: var(--hairline);
                background: var(--bg);
            }
            .nav-inner {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
            }
            .nav-logo {
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
                font-weight: 600;
                color: var(--ink);
                letter-spacing: 0.06em;
                text-decoration: none;
            }
            .desktop-nav {
                display: flex;
                align-items: center;
                gap: 2px;
            }
            .nav-link {
                font-size: 13px;
                font-weight: 500;
                color: var(--muted);
                padding: 6px 14px;
                border-radius: 6px;
                text-decoration: none;
                transition: color 0.15s ease;
            }
            .nav-link:hover {
                color: var(--ink);
            }
            .nav-link.active {
                color: var(--accent-t);
                font-weight: 600;
            }
            .mobile-toggle {
                display: none;
                background: none;
                border: none;
                padding: 8px;
                color: var(--ink);
                align-items: center;
            }
            .mobile-menu {
                display: none;
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 60;
                flex-direction: column;
                padding: 80px 28px 32px;
            }
            .mobile-menu.open {
                display: flex;
            }
            .mobile-close {
                position: absolute;
                top: 18px;
                right: 28px;
                background: none;
                border: none;
                color: var(--ink);
                padding: 8px;
                font-size: 24px;
                line-height: 1;
            }
            .mobile-link {
                font-family: "Syne", sans-serif;
                font-size: 26px;
                font-weight: 700;
                color: var(--ink);
                text-decoration: none;
                padding: 16px 0;
                border-bottom: 1px solid var(--hairline);
                display: block;
            }

            /* ── Footer ── */
            footer {
                border-top: 1px solid var(--hairline);
                padding: 40px 0;
            }
            .footer-inner {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 20px;
            }
            .footer-copy {
                font-size: 11px;
                color: var(--muted);
                letter-spacing: 0.04em;
            }
            .footer-links {
                display: flex;
                gap: 28px;
            }
            .footer-links a {
                font-size: 12px;
                color: var(--muted);
                text-decoration: none;
                transition: color 0.15s ease;
            }
            .footer-links a:hover {
                color: var(--ink);
            }

            /* ── Section label ── */
            .label {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--accent-t);
            }

            /* ── Hero ── */
            .hero {
                padding: 112px 0 96px;
                min-height: 88vh;
                display: flex;
                align-items: center;
            }
            .hero-avail {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 48px;
            }
            .avail-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--green);
                flex-shrink: 0;
            }
            .avail-text {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .hero-name {
                font-family: "Syne", sans-serif;
                font-size: clamp(3.75rem, 11vw, 8.5rem);
                font-weight: 800;
                line-height: 0.93;
                letter-spacing: -0.03em;
                color: var(--ink);
                margin-bottom: 36px;
            }
            .hero-role {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: uppercase;
                margin-bottom: 64px;
            }
            .stats-row {
                display: flex;
                border-top: 1px solid var(--hairline);
                border-bottom: 1px solid var(--hairline);
                margin-bottom: 56px;
            }
            .stat-item {
                flex: 1 1 160px;
                padding: 28px 40px 28px 0;
            }
            .stat-item + .stat-item {
                padding-left: 40px;
                border-left: 1px solid var(--hairline);
            }
            .stat-num {
                font-family: "JetBrains Mono", monospace;
                font-size: clamp(1.875rem, 3.5vw, 2.75rem);
                font-weight: 600;
                color: var(--ink);
                letter-spacing: -0.025em;
                line-height: 1;
                margin-bottom: 8px;
            }
            .stat-label {
                font-size: 13px;
                color: var(--muted);
                margin-bottom: 4px;
            }
            .stat-note {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--accent-t);
                letter-spacing: 0.06em;
            }
            .cta-row {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                align-items: center;
            }
            .btn-primary {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 24px;
                border-radius: 7px;
                background: var(--ink);
                color: var(--bg);
                font-weight: 600;
                font-size: 13px;
                text-decoration: none;
                letter-spacing: 0.01em;
                border: none;
                transition: background 0.15s ease;
            }
            .btn-primary:hover {
                background: var(--accent-t);
                color: var(--bg);
            }
            .btn-outline {
                display: inline-flex;
                align-items: center;
                padding: 12px 24px;
                border-radius: 7px;
                background: transparent;
                color: var(--ink);
                font-weight: 600;
                font-size: 13px;
                text-decoration: none;
                letter-spacing: 0.01em;
                border: 1px solid var(--hairline);
                transition: border-color 0.15s ease;
            }
            .btn-outline:hover {
                border-color: var(--muted);
            }

            /* ── Sections ── */
            .section {
                padding: 88px 0;
            }
            .section-hdr {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 36px;
                flex-wrap: wrap;
                gap: 16px;
            }
            .text-link {
                font-size: 12px;
                color: var(--accent-t);
                text-decoration: none;
                font-weight: 500;
                letter-spacing: 0.02em;
            }
            .text-link:hover {
                text-decoration: underline;
            }

            /* ── Home work list ── */
            .wl-item {
                display: grid;
                grid-template-columns: 44px 1fr auto;
                gap: 0 20px;
                align-items: center;
                padding: 22px 12px;
                margin: 0 -12px;
                border-bottom: 1px solid var(--hairline);
                cursor: pointer;
                border-radius: 6px;
                text-decoration: none;
                color: inherit;
                transition: background 0.15s ease;
            }
            .wl-item:hover {
                background: var(--accent-bg);
            }
            .wl-num {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--accent-t);
                letter-spacing: 0.1em;
            }
            .wl-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--ink);
                letter-spacing: -0.01em;
                margin-bottom: 3px;
            }
            .wl-co {
                font-size: 12px;
                color: var(--muted);
            }
            .wl-period {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                white-space: nowrap;
            }
            .bio-max {
                max-width: 700px;
            }
            .bio-lead {
                font-size: clamp(1.125rem, 2vw, 1.3125rem);
                line-height: 1.8;
                color: var(--ink);
                margin-top: 24px;
                margin-bottom: 20px;
            }
            .bio-body {
                font-size: 16px;
                line-height: 1.8;
                color: var(--muted);
                margin-bottom: 28px;
            }

            /* ── Page header ── */
            .page-hdr {
                padding: 96px 0 72px;
            }
            .page-title {
                font-family: "Syne", sans-serif;
                font-size: clamp(2.75rem, 7vw, 5.5rem);
                font-weight: 800;
                line-height: 0.95;
                letter-spacing: -0.03em;
                color: var(--ink);
                margin-top: 20px;
                margin-bottom: 24px;
            }
            .page-intro {
                font-size: 16px;
                color: var(--muted);
                max-width: 480px;
                line-height: 1.75;
            }

            /* ── Work accordion ── */
            .proj-list {
                padding: 48px 0 120px;
            }
            .proj-row {
                display: grid;
                grid-template-columns: 44px 1fr auto 24px;
                gap: 0 20px;
                align-items: start;
                padding: 32px 0;
                cursor: pointer;
                user-select: none;
                border: none;
                background: none;
                width: 100%;
                text-align: left;
            }
            .proj-num {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--accent-t);
                letter-spacing: 0.12em;
                padding-top: 5px;
            }
            .proj-title {
                font-size: clamp(1.125rem, 2.5vw, 1.5rem);
                font-weight: 700;
                color: var(--ink);
                letter-spacing: -0.02em;
                margin-bottom: 6px;
                line-height: 1.2;
            }
            .proj-meta {
                font-size: 13px;
                color: var(--muted);
            }
            .proj-period {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                padding-top: 5px;
                white-space: nowrap;
            }
            .proj-chevron {
                color: var(--muted);
                transition: transform 0.3s ease;
                padding-top: 5px;
                flex-shrink: 0;
            }
            .proj-chevron.open {
                transform: rotate(180deg);
            }
            .proj-body {
                overflow: hidden;
                max-height: 0;
                opacity: 0;
                transition:
                    max-height 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.35s ease;
            }
            .proj-body.open {
                opacity: 1;
            }
            .proj-inner {
                padding: 0 0 40px 64px;
            }
            .proj-desc {
                font-size: 15px;
                line-height: 1.8;
                color: var(--muted);
                max-width: 660px;
                margin-bottom: 32px;
            }
            .impact-lbl {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                color: var(--accent-t);
                letter-spacing: 0.14em;
                text-transform: uppercase;
                margin-bottom: 14px;
            }
            .impact-list {
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 24px;
            }
            .impact-item {
                font-size: 14px;
                color: var(--ink);
                display: flex;
                gap: 12px;
                line-height: 1.65;
                align-items: baseline;
            }
            .impact-dash {
                color: var(--accent);
                flex-shrink: 0;
                font-weight: 500;
            }
            .tags {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .tag {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                padding: 4px 10px;
                border-radius: 4px;
                border: 1px solid var(--hairline);
                color: var(--muted);
                letter-spacing: 0.06em;
            }
            .proj-divider {
                height: 1px;
                background: var(--hairline);
            }

            /* ── About ── */
            .about-hdr {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 48px;
                align-items: end;
            }
            .about-photo {
                width: 112px;
                height: 112px;
                border-radius: 50%;
                overflow: hidden;
                flex-shrink: 0;
                border: 2px solid var(--hairline);
            }
            .about-photo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .about-name {
                font-family: "Syne", sans-serif;
                font-size: clamp(2.75rem, 7vw, 5.5rem);
                font-weight: 800;
                line-height: 0.95;
                letter-spacing: -0.03em;
                color: var(--ink);
                margin-top: 20px;
                margin-bottom: 16px;
            }
            .about-role {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            .bio-section {
                padding: 72px 0;
            }
            .bio-p1 {
                font-size: 19px;
                line-height: 1.8;
                color: var(--ink);
                margin-bottom: 20px;
            }
            .bio-p {
                font-size: 16px;
                line-height: 1.8;
                color: var(--muted);
                margin-bottom: 20px;
            }

            /* ── Timeline ── */
            .exp-section {
                padding: 72px 0;
            }
            .timeline {
                padding-left: 160px;
                position: relative;
                margin-top: 40px;
            }
            .tl-spine {
                position: absolute;
                left: 128px;
                top: 8px;
                bottom: 0;
                width: 1px;
                background: var(--hairline);
            }
            .tl-item {
                position: relative;
                padding-left: 32px;
                padding-bottom: 48px;
            }
            .tl-item:last-child {
                padding-bottom: 0;
            }
            .tl-period {
                position: absolute;
                left: -160px;
                top: 3px;
                width: 120px;
                text-align: right;
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.06em;
                color: var(--muted);
            }
            .tl-period.cur {
                color: var(--accent-t);
            }
            .tl-dot {
                position: absolute;
                left: -5px;
                top: 7px;
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: var(--hairline);
                border: 2px solid var(--bg);
                outline: 1px solid var(--hairline);
            }
            .tl-dot.cur {
                background: var(--accent);
                outline-color: var(--accent);
            }
            .tl-role {
                font-size: 16px;
                font-weight: 600;
                color: var(--ink);
                letter-spacing: -0.01em;
                margin-bottom: 4px;
                line-height: 1.3;
            }
            .tl-org {
                font-size: 13px;
                color: var(--accent-t);
                margin-bottom: 10px;
                font-weight: 500;
            }
            .tl-desc {
                font-size: 14px;
                line-height: 1.75;
                color: var(--muted);
                max-width: 580px;
            }

            /* ── Skills ── */
            .skills-section {
                padding: 72px 0 112px;
            }
            .skills-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0 64px;
                margin-top: 36px;
            }
            .skill-row {
                display: grid;
                grid-template-columns: 120px 1fr;
                gap: 0 20px;
                border-top: 1px solid var(--hairline);
                padding: 18px 0;
            }
            .skill-area {
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding-top: 2px;
                line-height: 1.5;
            }
            .skill-items {
                font-size: 14px;
                color: var(--ink);
                line-height: 1.65;
            }

            /* ── Contact ── */
            .contact-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0 96px;
                align-items: start;
            }
            .form-fields {
                display: flex;
                flex-direction: column;
                gap: 32px;
            }
            .field {
                display: flex;
                flex-direction: column;
            }
            .field-lbl {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                font-weight: 600;
                color: var(--muted);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                margin-bottom: 10px;
            }
            .field input,
            .field textarea {
                width: 100%;
                padding: 12px 0;
                border: none;
                border-bottom: 1px solid var(--hairline);
                background: transparent;
                color: var(--ink);
                font-size: 15px;
                font-family: inherit;
                outline: none;
                transition: border-color 0.2s ease;
                border-radius: 0;
                resize: vertical;
            }
            .field input:focus,
            .field textarea:focus {
                border-bottom-color: var(--accent);
            }
            .sent-icon {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: var(--accent-bg);
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 20px;
            }
            .sent-title {
                font-size: 18px;
                font-weight: 600;
                color: var(--ink);
                margin-bottom: 8px;
            }
            .sent-sub {
                font-size: 15px;
                color: var(--muted);
            }
            .info-rows {
                padding-top: 8px;
            }
            .info-row {
                display: grid;
                grid-template-columns: 88px 1fr;
                gap: 0 16px;
                border-top: 1px solid var(--hairline);
                padding: 16px 0;
                align-items: baseline;
            }
            .info-lbl {
                font-family: "JetBrains Mono", monospace;
                font-size: 9px;
                color: var(--muted);
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .info-val {
                font-size: 14px;
                color: var(--ink);
            }
            .info-val a {
                color: var(--ink);
                text-decoration: none;
                transition: color 0.15s ease;
            }
            .info-val a:hover {
                color: var(--accent-t);
            }
            .info-muted {
                color: var(--muted);
            }

            /* ── Responsive ── */
            @media (max-width: 680px) {
                .desktop-nav {
                    display: none;
                }
                .mobile-toggle {
                    display: flex;
                }
                .stats-row {
                    flex-direction: column;
                }
                .stat-item + .stat-item {
                    border-left: none;
                    border-top: 1px solid var(--hairline);
                    padding-left: 0;
                }
                .stat-item {
                    padding-right: 0;
                }
                .contact-grid {

                const main = document.getElementById("main");

                // Disconnect previous observer
                if (revealObserver) {
                    revealObserver.disconnect();
                    revealObserver = null;
                }

                // Render page
                const pages = {
                    "/": pageHome,
                    "/work": pageWork,
                    "/about": pageAbout,
                    "/contact": pageContact,
                };
                const fn = pages[path] || pages["/"];
                main.innerHTML = `<div id="main-inner" style="animation:none">${fn()}</div>`;

                // Scroll to top
                window.scrollTo(0, 0);

                // Update nav active state
                document.querySelectorAll(".nav-link").forEach((a) => {
                    a.classList.toggle("active", a.dataset.path === path);
                });

                // Setup page interactions
                setupReveal();
                if (path === "/work") setupAccordion();
                if (path === "/contact") setupContactForm();
            }

            function setupReveal() {
                revealObserver = new IntersectionObserver(
                    (entries) =>
                        entries.forEach((e) => {
                            if (e.isIntersecting)
                                e.target.classList.add("visible");
                        }),
                    { threshold: 0.07, rootMargin: "0px 0px -32px 0px" },
                );
                document
                    .querySelectorAll("#main .reveal")
                    .forEach((el) => revealObserver.observe(el));
            }

            function setupAccordion() {
                document.querySelectorAll("[data-toggle]").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        const i = btn.dataset.toggle;
                        const body = document.getElementById("pb" + i);
                        const chev = btn.querySelector("[data-chev]");
                        const isOpen = body.classList.contains("open");

                        // Close all
                        document.querySelectorAll(".proj-body").forEach((b) => {
                            b.style.maxHeight = "0";
                            b.classList.remove("open");
                        });
                        document
                            .querySelectorAll("[data-chev]")
                            .forEach((c) => c.classList.remove("open"));
                        document
                            .querySelectorAll("[data-toggle]")
                            .forEach((r) =>
                                r.setAttribute("aria-expanded", "false"),
                            );

                        if (!isOpen) {
                            body.style.maxHeight = body.scrollHeight + "px";
                            body.classList.add("open");
                            chev.classList.add("open");
                            btn.setAttribute("aria-expanded", "true");
                        }
                    });
                });
            }

            function setupContactForm() {
                const form = document.getElementById("contact-form");

                );
            });

            /* ── Hash routing ── */
            window.addEventListener("hashchange", () => render(getPath()));
            render(getPath());

            /* ── Footer year ── */
            document.getElementById("yr").textContent =
                new Date().getFullYear();
        </script>
    </body>
</html>
