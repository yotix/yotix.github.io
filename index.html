<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

            name="description"
            content="Yogesh Bhardwaj — Cloud Lead. Architecting scalable infrastructure, leading cloud transformation, and building resilient distributed systems."
        />
        <meta property="og:title" content="Yogesh Bhardwaj — Cloud Lead" />
        <meta
            property="og:description"
            content="Cloud infrastructure leadership. Scalable systems. Distributed architecture."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <title>Yogesh Bhardwaj — Cloud Lead</title>
        <link rel="icon" type="image/png" href="logo192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    sans-serif;
                color: #181818;
                background: #ffffff;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                overflow-x: hidden;
            }
            code,
            .font-mono {
                font-family: "JetBrains Mono", monospace;
            }
            :focus-visible {
                outline: 2px solid #2563eb;
                outline-offset: 2px;
                border-radius: 4px;
            }

            /* ── Entry Animations ── */
            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(24px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateX(-16px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
            @keyframes scaleIn {
                from {
                    opacity: 0;
                    transform: scale(0.96);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            @keyframes grain {
                0%,
                100% {
                    transform: translate(0, 0);
                }
                10% {
                    transform: translate(-5%, -10%);
                }
                20% {
                    transform: translate(-15%, 5%);
                }
                30% {
                    transform: translate(7%, -25%);
                }
                40% {
                    transform: translate(-5%, 25%);
                }
                50% {
                    transform: translate(-15%, 10%);
                }
                60% {
                    transform: translate(15%, 0%);
                }
                70% {
                    transform: translate(0%, 15%);
                }
                80% {
                    transform: translate(3%, 35%);
                }
                90% {
                    transform: translate(-10%, 10%);
                }
            }

            .anim-fade-up {
                animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .anim-fade-up-d1 {
                animation-delay: 0.1s;
            }
            .anim-fade-up-d2 {
                animation-delay: 0.2s;
            }
            .anim-fade-up-d3 {
                animation-delay: 0.3s;
            }
            .anim-fade-up-d4 {
                animation-delay: 0.4s;
            }
            .anim-fade-in {
                animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .anim-slide-in {
                animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .anim-scale-in {
                animation: scaleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ── Hover Card Elevation ── */
            .card-hover {
                transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .card-hover:hover {
                transform: translateY(-1px);
            }

            /* ── Section Divider ── */
            .section-divider {
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(232, 232, 232, 0.8) 50%,
                    transparent 100%
                );
            }
            /* ── Mobile nav responsive control ── */
            .nav-hamburger {
                display: flex !important;
            }
            @media (min-width: 1024px) {
                .nav-hamburger {
                    display: none !important;
                }
                .nav-desktop {
                    display: flex !important;
                }
            }
            @media (max-width: 1023px) {
                .nav-desktop {
                    display: none !important;
                }
            }
            /* ── Nav Active Indicator ── */
            .nav-link {
                position: relative;
                transition: color 0.15s ease;
            }
            .nav-link::after {
                content: "";
                position: absolute;
                bottom: -4px;
                left: 0;
                width: 0;
                height: 1px;
                background: #181818;
                transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .nav-link-active::after {
                width: 100%;
            }

            /* ── Tag Pill ── */
            .tag-pill {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 5px 10px;
                min-height: 24px;
                border-radius: 0;
                font-size: 12px;
                font-weight: 400;
                font-family: "'JetBrains Mono', monospace";
                letter-spacing: 0;
                border: 1px solid #e8e8e8;
                background: transparent;
                color: #666666;
                transition: color 0.15s ease;
            }
            .tag-pill:hover {
                color: #181818;
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
                html {
                    scroll-behavior: auto;
                }
            }

            /* ═══════════════════════════════════════════════
               ENHANCED ANIMATIONS — Phase 1
            ═══════════════════════════════════════════════ */

            /* ── Scroll Reveal Animations ── */
            .reveal-up {
                opacity: 0;
                transform: translateY(40px);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-up.visible {
                opacity: 1;
                transform: translateY(0);
            }
            .reveal-left {
                opacity: 0;
                transform: translateX(-40px);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-left.visible {
                opacity: 1;
                transform: translateX(0);
            }
            .reveal-right {
                opacity: 0;
                transform: translateX(40px);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-right.visible {
                opacity: 1;
                transform: translateX(0);
            }
            .reveal-scale {
                opacity: 0;
                transform: scale(0.9);
                transition:
                    opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .reveal-scale.visible {
                opacity: 1;
                transform: scale(1);
            }

            /* ── Stagger Children Animation ── */
            .stagger-children > * {
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .stagger-children.visible > *:nth-child(1) {
                transition-delay: 0s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(2) {
                transition-delay: 0.1s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(3) {
                transition-delay: 0.2s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(4) {
                transition-delay: 0.3s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(5) {
                transition-delay: 0.4s;
                opacity: 1;
                transform: translateY(0);
            }
            .stagger-children.visible > *:nth-child(6) {
                transition-delay: 0.5s;
                opacity: 1;
                transform: translateY(0);
            }

            /* ── Animated Counter ── */
            @keyframes countUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .counter-animated {
                animation: countUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ── Animated Divider Line ── */
            @keyframes expandWidth {
                from {
                    width: 0;
                }
                to {
                    width: 100%;
                }
            }
            .divider-animated {
                height: 2px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(37, 99, 235, 0.3),
                    transparent
                );
                animation: expandWidth 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ── Page Transition ── */
            @keyframes pageEnter {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .page-enter {
                animation: pageEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            @media (min-width: 1100px) {
                .hero-photo {
                    display: block;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/babel">
            const { useState, useEffect, createContext, useContext, useRef } =
                React;
            const { createRoot } = ReactDOM;

            /* ── Lightweight SPA Router ── */
            const RouterCtx = createContext();
            function Router({ children }) {
                const [path, setPath] = useState(
                    window.location.hash.slice(1) || "/",
                );
                useEffect(() => {
                    const onHash = () =>
                        setPath(window.location.hash.slice(1) || "/");
                    window.addEventListener("hashchange", onHash);
                    return () =>
                        window.removeEventListener("hashchange", onHash);
                }, []);
                const navigate = (to) => {
                    window.location.hash = to;
                };
                return (
                    <RouterCtx.Provider value={{ path, navigate }}>
                        {children}
                    </RouterCtx.Provider>
                );
            }
            function Route({ path, element }) {
                const { path: current } = useContext(RouterCtx);
                if (current === path) return element;
                return null;
            }
            function Link({ to, children, style, ...props }) {
                const { navigate } = useContext(RouterCtx);
                const href = to.startsWith("#") ? to : "#" + to;
                return (
                    <a
                        href={href}
                        onClick={(e) => {
                            e.preventDefault();
                            navigate(to);
                        }}
                        style={{
                            textDecoration: "none",
                            cursor: "pointer",
                            ...style,
                        }}
                        {...props}
                    >
                        {children}
                    </a>
                );
            }
            function useLocation() {
                const { path } = useContext(RouterCtx);
                return { pathname: path };
            }

            /* ── Scroll Animation Hook ── */
            const useScrollAnimations = () => {
                useEffect(() => {
                    const observer = new IntersectionObserver(
                        (entries) => {
                            entries.forEach((entry) => {
                                if (entry.isIntersecting) {
                                    entry.target.classList.add("visible");
                                }
                            });
                        },
                        { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
                    );

                    const elements = document.querySelectorAll(
                        ".reveal-up, .reveal-left, .reveal-right, .reveal-scale, .stagger-children, .text-reveal",
                    );
                    elements.forEach((el) => observer.observe(el));

                    return () => observer.disconnect();
                }, []);
            };

            /* ── Animated Counter Hook ── */
            const useAnimatedCounter = (target, duration = 2000) => {
                const [count, setCount] = useState(target);
                const ref = useRef(null);
                const hasAnimated = useRef(false);

                useEffect(() => {
                    const observer = new IntersectionObserver(
                        (entries) => {
                            if (
                                entries[0].isIntersecting &&
                                !hasAnimated.current
                            ) {
                                hasAnimated.current = true;
                                setCount(0);
                                const startTime = performance.now();

                                const animate = (currentTime) => {
                                    const elapsed = currentTime - startTime;
                                    const progress = Math.min(
                                        elapsed / duration,
                                        1,
                                    );
                                    const eased = 1 - Math.pow(1 - progress, 3);
                                    setCount(
                                        Math.floor(target * eased),
                                    );

                                    if (progress < 1) {
                                        requestAnimationFrame(animate);
                                    }
                                };

                                requestAnimationFrame(animate);
                            }
                        },
                        { threshold: 0.2, rootMargin: "0px 0px -10% 0px" },
                    );

                    if (ref.current) {
                        observer.observe(ref.current);
                    }

                    return () => observer.disconnect();
                }, [target, duration]);

                return { count, ref };
            };

            /* ── Scroll Progress Hook ── */
            const useScrollProgress = () => {
                const [progress, setProgress] = useState(0);
                useEffect(() => {
                    const onScroll = () => {
                        const scrollTop = window.scrollY;
                        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                        setProgress(docHeight > 0 ? scrollTop / docHeight : 0);
                    };
                    window.addEventListener("scroll", onScroll, { passive: true });
                    onScroll();
                    return () => window.removeEventListener("scroll", onScroll);
                }, []);
                return progress;
            };

            /* ── Mouse Position Hook (cursor follower) ── */
            const useMousePosition = () => {
                const [pos, setPos] = useState({ x: -100, y: -100 });
                useEffect(() => {
                    const onMove = (e) => setPos({ x: e.clientX, y: e.clientY });
                    window.addEventListener("mousemove", onMove, { passive: true });
                    return () => window.removeEventListener("mousemove", onMove);
                }, []);
                return pos;
            };

            /* ── Parallax Hook ── */
            const useParallax = (factor = 0.3) => {
                const ref = useRef(null);
                const [offset, setOffset] = useState(0);
                useEffect(() => {
                    const onScroll = () => {
                        if (!ref.current) return;
                        const rect = ref.current.getBoundingClientRect();
                        const center = rect.top + rect.height / 2;
                        const viewCenter = window.innerHeight / 2;
                        setOffset((center - viewCenter) * factor);
                    };
                    window.addEventListener("scroll", onScroll, { passive: true });
                    onScroll();
                    return () => window.removeEventListener("scroll", onScroll);
                }, [factor]);
                return { ref, offset };
            };

            /* ── Magnetic Effect Hook ── */
            const useMagneticEffect = () => {
                useEffect(() => {
                    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
                    if (isTouch) return;

                    const magnets = document.querySelectorAll(".magnetic");
                    magnets.forEach((el) => {
                        const strength = 18;
                        let bounds;

                        const onEnter = () => {
                            bounds = el.getBoundingClientRect();
                            el.style.transition = "none";
                        };
                        const onMove = (e) => {
                            if (!bounds) return;
                            const centerX = bounds.left + bounds.width / 2;
                            const centerY = bounds.top + bounds.height / 2;
                            const dx = (e.clientX - centerX) / strength;
                            const dy = (e.clientY - centerY) / strength;
                            el.style.transform = `translate(${dx}px, ${dy}px)`;
                        };
                        const onLeave = () => {
                            el.style.transition = "transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)";
                            el.style.transform = "translate(0, 0)";
                            bounds = null;
                        };

                        el.addEventListener("mouseenter", onEnter);
                        el.addEventListener("mousemove", onMove, { passive: true });
                        el.addEventListener("mouseleave", onLeave);

                        return () => {
                            el.removeEventListener("mouseenter", onEnter);
                            el.removeEventListener("mousemove", onMove);
                            el.removeEventListener("mouseleave", onLeave);
                        };
                    });
                }, []);
            };

            /* ── Design Tokens (Designs.md system) ── */
            const T = {
                canvas: "#ffffff",
                canvasSoft: "#f7f7f7",
                ink: "#181818",
                body: "#969696",
                muted: "#666666",
                mutedSoft: "#8f8f8f",
                accent: "#2563eb",
                accentActive: "#1a45b0",
                hairline: "#e8e8e8",
                hairlineSoft: "#ebebeb",
                success: "#03904a",
                warning: "#f13a2c",
                onAccent: "#ffffff",
            };

            /* ── Shared Styles (Designs.md: sharp, 500 display, uppercase tracking) ── */
            const S = {
                container: {
                    maxWidth: 1280,
                    margin: "0 auto",
                    padding: "0 32px",
                },
                label: {
                    fontSize: 11,
                    fontWeight: 600,
                    letterSpacing: "0.11em",
                    textTransform: "uppercase",
                    color: T.accent,
                    marginBottom: 16,
                },
                display: {
                    fontWeight: 500,
                    letterSpacing: "-0.02em",
                    lineHeight: 1.05,
                    color: T.ink,
                },
                heading: {
                    fontWeight: 500,
                    letterSpacing: "-0.015em",
                    lineHeight: 1.2,
                    color: T.ink,
                },
                body: {
                    fontSize: 14,
                    fontWeight: 400,
                    lineHeight: 1.5,
                    color: T.body,
                },
                hairline: `1px solid ${T.hairline}`,
            };

            /* ── Skip Link ── */
            const SkipLink = () => (
                <a
                    href='#main-content'
                    style={{
                        position: "absolute",
                        top: "-100%",
                        left: 16,
                        background: T.accent,
                        color: "#fff",
                        padding: "8px 16px",
                        borderRadius: 8,
                        zIndex: 999,
                        fontWeight: 600,
                        fontSize: 14,
                    }}
                    onFocus={(e) => (e.target.style.top = "16px")}
                    onBlur={(e) => (e.target.style.top = "-100%")}
                >
                    Skip to content
                </a>
            );

            /* ── Cursor Follower ── */
            const CursorFollower = () => {
                const mouse = useMousePosition();
                const [active, setActive] = useState(false);
                const [isTouch, setIsTouch] = useState(false);

                useEffect(() => {
                    setIsTouch("ontouchstart" in window || navigator.maxTouchPoints > 0);
                }, []);

                useEffect(() => {
                    const check = (e) => {
                        const target = e.target;
                        const match = target.closest('a, button, .magnetic, [role="button"]');
                        setActive(!!match);
                    };
                    document.addEventListener("mouseover", check, { passive: true });
                    return () => document.removeEventListener("mouseover", check);
                }, []);

                if (isTouch) return null;

                return (
                    <React.Fragment>
                        <div
                            className={`cursor-dot ${active ? "active" : ""}`}
                            style={{
                                left: mouse.x - 4,
                                top: mouse.y - 4,
                            }}
                        />
                        <div
                            className={`cursor-ring ${active ? "active" : ""}`}
                            style={{
                                left: mouse.x - 20,
                                top: mouse.y - 20,
                                transform: active ? "scale(1.3)" : "scale(1)",
                            }}
                        />
                    </React.Fragment>
                );
            };

            /* ── Page Grain Overlay ── */
            const PageGrain = () => <div className='page-grain' />;

            /* ── Navbar ── */
            const Navbar = () => {
                const [open, setOpen] = useState(false);
                const scrollProgress = useScrollProgress();
                const loc = useLocation();
                const links = [
                    { to: "/", label: "Home" },
                    { to: "/work", label: "Work" },
                    { to: "/about", label: "About" },
                    { to: "/contact", label: "Contact" },
                ];
                const active = (p) => loc.pathname === p;

                return (
                    <header
                        style={{
                            position: "sticky",
                            top: 0,
                            zIndex: 50,
                            borderBottom: S.hairline,
                            background: `rgba(255, 255, 255, 0.92)`,
                            backdropFilter: "blur(16px) saturate(180%)",
                            WebkitBackdropFilter: "blur(16px) saturate(180%)",
                        }}
                    >
                        {/* Scroll Progress Bar */}
                        <div
                            className='scroll-progress'
                            style={{ transform: `scaleX(${scrollProgress})` }}
                        />
                        <nav aria-label='Main navigation'>
                        <div
                            style={{
                                maxWidth: 1120,
                                margin: "0 auto",
                                padding: "0 24px",
                                height: 64,
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "space-between",
                            }}
                        >
                            <Link
                                to='/'
                                style={{
                                    fontWeight: 700,
                                    fontSize: 15,
                                    color: T.ink,
                                    letterSpacing: "-0.02em",
                                    display: "flex",
                                    alignItems: "center",
                                    gap: 10,
                                }}
                            >
                                <span
                                    style={{
                                        width: 28,
                                        height: 28,
                                        borderRadius: 0,
                                        background: T.ink,
                                        display: "flex",
                                        alignItems: "center",
                                        justifyContent: "center",
                                        color: "#fff",
                                        fontSize: 12,
                                        fontWeight: 700,
                                    }}
                                >
                                    Y
                                </span>
                                Yogesh Bhardwaj
                            </Link>

                            <div
                                className='nav-desktop'
                                style={{
                                    alignItems: "center",
                                    gap: 8,
                                }}
                            >
                                    {links.map((l) => {
                                    const isActive = active(l.to);
                                    return (
                                        <Link
                                            key={l.to}
                                            to={l.to}
                                            className={
                                                isActive
                                                    ? "nav-link nav-link-active"
                                                    : "nav-link"
                                            }
                                            style={{
                                                color: isActive
                                                    ? T.ink
                                                    : T.muted,
                                                fontSize: 13,
                                                fontWeight: 600,
                                                letterSpacing: "0.065em",
                                                textTransform: "uppercase",
                                                padding: "8px 12px",
                                                minHeight: 24,
                                                display: "inline-flex",
                                                alignItems: "center",
                                                transition: "color 0.15s ease",
                                            }}
                                            onMouseEnter={(e) => {
                                                if (!isActive) {
                                                    e.target.style.color = T.ink;
                                                }
                                            }}
                                            onMouseLeave={(e) => {
                                                if (!isActive) {
                                                    e.target.style.color = T.muted;
                                                }
                                            }}
                                        >
                                            {l.label}
                                        </Link>
                                    );
                                })}

                                <a
                                    href='/old/static/files/resume.pdf'
                                    target='_blank'
                                    rel='noopener noreferrer'
                                    className='nav-desktop'
                                    style={{
                                        display: "inline-flex",
                                        alignItems: "center",
                                        fontSize: 13,

                                    className='anim-fade-up anim-fade-up-d2'
                                    style={{
                                        fontSize: 16,
                                        color: T.body,
                                        lineHeight: 1.7,
                                        maxWidth: 520,
                                    }}
                                >
                                    Open to cloud architecture consulting,
                                    platform engineering leadership roles, and
                                    speaking engagements.
                                </p>
                            </Section>
                        </div>

                        {/* Contact Form + Info */}
                        <Section style={{ padding: "80px 0" }}>
                            <div className='grid grid-cols-1 lg:grid-cols-5 gap-12'>
                                {/* Form — 3 cols */}
                                <div className='lg:col-span-3 reveal-left'>
                                    {sent ? (
                                    <div
                                        style={{
                                            padding: 40,
                                            background: T.canvasSoft,
                                            borderRadius: 0,
                                            border: S.hairline,
                                            textAlign: "center",
                                        }}
                                    >
                                        <div
                                            style={{
                                                width: 48,
                                                height: 48,
                                                borderRadius: 0,
                                                background: T.hairline,
                                                display: "flex",
                                                alignItems: "center",
                                                justifyContent: "center",
                                                margin: "0 auto 20px",
                                            }}
                                        >
                                                <svg
                                                    width='24'
                                                    height='24'
                                                    fill='none'
                                                    stroke={T.success}
                                                    strokeWidth='2.5'
                                                    strokeLinecap='round'
                                                    strokeLinejoin='round'
                                                >
                                                    <path d='M5 12l5 5L20 7' />
                                                </svg>
                                            </div>
                                            <p
                                                style={{
                                                    fontWeight: 700,
                                                    color: T.ink,
                                                    fontSize: 18,
                                                    marginBottom: 8,
                                                }}
                                            >
                                                Message sent
                                            </p>
                                            <p
                                                style={{
                                                    fontSize: 15,
                                                    color: T.muted,
                                                }}
                                            >
                                                I'll get back to you within 24
                                                hours.
                                            </p>
                                        </div>
                                    ) : (
                                        <form
                                            onSubmit={(e) => {
                                                e.preventDefault();
                                                const fd = new FormData(e.target);
                                                const name = fd.get("name") || "";
                                                const email = fd.get("email") || "";
                                                const message = fd.get("message") || "";
                                                const subject = encodeURIComponent(
                                                    `Portfolio inquiry from ${name}`,
                                                );
                                                const body = encodeURIComponent(
                                                    `From: ${name} (${email})\n\n${message}`,
                                                );
                                                window.location.href = `mailto:yogesh.bhardwaj@hotmail.com?subject=${subject}&body=${body}`;
                                                setSent(true);
                                            }}
                                            style={{
                                                display: "flex",
                                                flexDirection: "column",
                                                gap: 24,
                                            }}
                                        >
                                            <InputField
                                                id='name'
                                                label='Name'
                                                type='text'
                                                name='name'
                                            />
                                            <InputField
                                                id='email'
                                                label='Email'
                                                type='email'
                                                name='email'
                                            />
                                            <InputField
                                                id='message'
                                                label='Message'
                                                rows={6}
                                                name='message'
                                            />
                                            <button
                                                type='submit'
                                                className='magnetic'
                                                style={{
                                                    padding: "14px 32px",
                                                    height: 48,
                                                    background: T.accent,
                                                    color: "#fff",
                                                    border: "none",
                                                    borderRadius: 0,
                                                    fontWeight: 700,
                                                    fontSize: 14,
                                                    letterSpacing: "0.14em",
                                                    textTransform: "uppercase",
                                                    cursor: "pointer",
                                                    fontFamily: "inherit",
                                                    alignSelf: "flex-start",
                                                    transition: "background 0.15s ease",
                                                }}
                                                onMouseEnter={(e) => {
                                                    e.target.style.background = T.accentActive;
                                                }}
                                                onMouseLeave={(e) => {
                                                    e.target.style.background = T.accent;
                                                }}
                                            >
                                                Send Message
                                            </button>
                                        </form>
                                    )}
                                </div>

                                {/* Contact Info — 2 cols */}
                                <div
                                    className='lg:col-span-2 reveal-right'
                                    style={{
                                        display: "flex",
                                        flexDirection: "column",
                                        gap: 40,
                                    }}
                                >
                                    {/* Email */}
                                    <div>
                                        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.11em", textTransform: "uppercase", color: T.muted, marginBottom: 8 }}>Email</p>
                                        <a
                                            href='mailto:yogesh.bhardwaj@hotmail.com'
                                            style={{
                                                fontSize: 15,
                                                color: T.ink,
                                                textDecoration: "none",
                                                fontWeight: 500,
                                                transition: "color 0.15s",
                                            }}
                                            onMouseEnter={(e) => e.target.style.color = T.accent}
                                            onMouseLeave={(e) => e.target.style.color = T.ink}
                                        >
                                            yogesh.bhardwaj@hotmail.com
                                        </a>
                                    </div>

                                    {/* Social */}
                                    <div>
                                        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.11em", textTransform: "uppercase", color: T.muted, marginBottom: 16 }}>Social</p>
                                        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                                            {[
                                                { label: "GitHub", url: "https://github.com/yotix" },
                                                { label: "LinkedIn", url: "https://linkedin.com/in/yogeshbhardwaj" },
                                                { label: "Twitter", url: "https://x.com/yotixji" },
                                            ].map((s) => (
                                                <a
                                                    key={s.label}
                                                    href={s.url}
                                                    target='_blank'
                                                    rel='noopener noreferrer'
                                                    style={{
                                                        fontSize: 14,
                                                        color: T.body,
                                                        textDecoration: "none",
                                                        display: "flex",
                                                        alignItems: "center",
                                                        gap: 8,
                                                        transition: "color 0.15s, gap 0.2s",
                                                    }}
                                                    onMouseEnter={(e) => {
                                                        e.target.style.color = T.accent;
                                                        e.target.style.gap = "12px";
                                                    }}
                                                    onMouseLeave={(e) => {
                                                        e.target.style.color = T.body;
                                                        e.target.style.gap = "8px";
                                                    }}
                                                >
                                                    {s.label}
                                                    <svg width='14' height='14' fill='none' stroke='currentColor' strokeWidth='2' strokeLinecap='round' strokeLinejoin='round'><path d='M5 10l5-5-5-5' /></svg>
                                                </a>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Location */}
                                    <div>
                                        <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.11em", textTransform: "uppercase", color: T.muted, marginBottom: 8 }}>Location</p>
                                        <p style={{ fontSize: 14, color: T.ink, fontWeight: 500 }}>Berlin, Germany</p>
                                        <p style={{ fontSize: 13, color: T.body, marginTop: 4 }}>CET (UTC+1)</p>
                                    </div>

                                    {/* Availability */}
                                    <div style={{ borderTop: S.hairline, paddingTop: 32 }}>
                                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                                            <span style={{ width: 8, height: 8, borderRadius: "50%", background: T.success }} />
                                            <span style={{ fontSize: 14, fontWeight: 500, color: T.ink }}>Open to opportunities</span>
                                        </div>
                                        <p style={{ fontSize: 13, color: T.body, lineHeight: 1.6 }}>
                                            Full-time roles, contract engagements, and advisory positions.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </Section>
                    </main>
                );
            };

            /* ── App Shell ── */
            const App = () => (
                <Router>
                    <SkipLink />
                    <CursorFollower />
                    <PageGrain />
                    <Navbar />
                    <Route path='/' element={<HomePage />} />
                    <Route path='/work' element={<WorkPage />} />
                    <Route path='/about' element={<AboutPage />} />
                    <Route path='/contact' element={<ContactPage />} />
                    <Footer />
                </Router>
            );

            const root = createRoot(document.getElementById("root"));
            root.render(<App />);
        </script>
    </body>
</html>
